name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

env:
  GEODE_VERSION: 5.11.2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            target: Android32
          - name: Android64
            target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack newest zip (if present)
        run: |
          if ls *.zip >/dev/null 2>&1; then
            zipfile="$(ls -t *.zip | head -n1)"
            echo "Using $zipfile"
            mkdir -p _unz
            unzip -o "$zipfile" -d _unz
            root="$(dirname "$(find _unz -name CMakeLists.txt | head -n1)")"
            cp -r "$root"/. .
            rm -rf _unz
          fi

      - name: Sync Geode version in mod.json
        run: |
          sed -i -E 's/"geode"[[:space:]]*:[[:space:]]*"[^"]*"/"geode": "${{ env.GEODE_VERSION }}"/' mod.json
          cat mod.json

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v${{ env.GEODE_VERSION }}
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
